# Full local stack: Ollama (LLM) + API (retrieval/generation) + Streamlit (UI).
# Bedrock mode: set LLM_PROVIDER=bedrock / RETRIEVAL_BACKEND=kb in .env and the
# ollama service becomes unused.
services:
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]

  api:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on: [ollama]
    volumes: ["./chroma_db:/app/chroma_db"]

  ui:
    build: .
    command: streamlit run streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports: ["8501:8501"]
    environment:
      - API_URL=http://api:8000/ask
    depends_on: [api]

volumes:
  ollama:
